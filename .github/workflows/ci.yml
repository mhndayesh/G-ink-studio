name: CI

on:
  push:
    branches: ["main", "cleanup/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r requirements.txt
      - name: Start API
        run: |
          cp .env.example .env
          # keep all optional integrations off so CI needs no external services
          sed -i 's/^MANGA_LLM_ENABLED=.*/MANGA_LLM_ENABLED=false/;       s/^MANGA_NEO4J_ENABLED=.*/MANGA_NEO4J_ENABLED=false/;       s/^MANGA_QDRANT_ENABLED=.*/MANGA_QDRANT_ENABLED=false/' .env || true
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8080 &
          echo $! > /tmp/api.pid
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/api/v1/health && break
            sleep 1
          done
      - name: Smoke test
        run: python tests/smoke_test.py
      - name: Stop API
        if: always()
        run: kill "$(cat /tmp/api.pid)" || true
      # TODO: add `pytest` here once unit tests exist (see docs/REPO-CRITIQUE.md)

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
      - run: npm run smoke
