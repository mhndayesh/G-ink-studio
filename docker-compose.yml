services:
  api:
    build:
      context: ./apps/api
    ports:
      - "8000:8000"
    environment:
      MANGA_STORAGE_ROOT: /app/storage/stories
      MANGA_REGISTRY_SQLITE_PATH: /app/storage/manga_registry.sqlite
      MANGA_AUTH_ENABLED: "false"
      MANGA_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      MANGA_NEO4J_ENABLED: "true"
      MANGA_NEO4J_URI: bolt://neo4j:7687
      MANGA_NEO4J_USER: neo4j
      MANGA_NEO4J_PASSWORD: manga_maker_password
      MANGA_QDRANT_ENABLED: "true"
      MANGA_QDRANT_URL: http://qdrant:6333
    volumes:
      - ./storage:/app/storage
    depends_on:
      - neo4j
      - qdrant
  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_MANGA_USER_ID: dev_user
    volumes:
      - ./apps/web:/app
    depends_on:
      - api

  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/manga_maker_password
    volumes:
      - neo4j_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  neo4j_data:
  qdrant_data:
