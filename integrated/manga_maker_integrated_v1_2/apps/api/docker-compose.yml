services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: manga_maker
      POSTGRES_USER: manga
      POSTGRES_PASSWORD: manga
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro

  api:
    image: python:3.12-slim
    working_dir: /app
    command: bash -lc "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      MANGA_STORAGE_ROOT: /app/storage/stories
      MANGA_REGISTRY_SQLITE_PATH: /app/storage/manga_registry.sqlite
      MANGA_NEO4J_ENABLED: "true"
      MANGA_NEO4J_URI: bolt://neo4j:7687
      MANGA_NEO4J_USER: neo4j
      MANGA_NEO4J_PASSWORD: manga_maker_password
      MANGA_QDRANT_ENABLED: "true"
      MANGA_QDRANT_URL: http://qdrant:6333
    depends_on:
      - postgres
      - neo4j
      - qdrant

  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/manga_maker_password
    volumes:
      - neo4j_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  neo4j_data:
  qdrant_data:
